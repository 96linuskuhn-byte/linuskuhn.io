<style>
:root{
  --bg:#faf9f5;
  --panel:#f1efe8;
  --blue:#3a3af0;
  --blue-soft:#eceafe;
  --ink:#17171d;
  --grey:#6d6d78;
  --line:rgba(23,23,29,.14);
  --r:4px;
  --r-img:4px;
}
*{margin:0;padding:0;box-sizing:border-box}
p{text-align:justify;text-justify:inter-word;hyphens:auto;word-spacing:-.03em}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'JetBrains Mono',monospace;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  opacity:0;
  transform:translateY(18px);
  transition:opacity .5s cubic-bezier(.2,.6,.2,1),transform .5s cubic-bezier(.2,.6,.2,1);
}
body.page-ready{opacity:1;transform:none}
h1,h2,.display{
  font-family:'Archivo',sans-serif;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:-.02em;
  line-height:1.02;
}
a{color:inherit;text-decoration:none}
::selection{background:var(--blue);color:#fff}
img{display:block;max-width:100%}

.boxlink{
  display:inline-block;
  font-family:'Archivo',sans-serif;
  font-weight:500;
  font-size:.85rem;
  letter-spacing:-.02em;
  text-transform:uppercase;
  color:var(--ink);
  transition:color .15s;
}
.boxlink:hover{color:var(--blue)}
.boxlink.inv{color:var(--ink)}
.boxlink.inv:hover{color:var(--blue)}
.arrow-l::before{content:"\2190";margin-right:6px}
.arrow::after{content:"\2192";margin-left:6px}

.crumb-bar{
  position:fixed;top:16px;left:0;right:0;z-index:100;
  padding:14px clamp(20px,3vw,36px);
}
.crumb-bar .crumb-blur{
  position:absolute;inset:0;z-index:0;border-radius:inherit;
  background:rgba(250,249,245,.1);
  border:1.5px solid rgba(23,23,29,.09);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 0 24px rgba(23,23,29,.1);
  pointer-events:none;
}
.crumb-bar .boxlink{position:relative;z-index:1}

main{max-width:1100px;margin:0 auto;padding:30px clamp(20px,5vw,40px) 80px}

.p-head{border-bottom:var(--dash,1px solid rgba(23,23,29,.16));padding-bottom:0;margin-bottom:34px}
.p-label{
  display:inline-block;align-self:flex-start;
  background:var(--blue-soft);color:var(--blue);
  font-size:.72rem;font-weight:700;letter-spacing:.04em;
  padding:4px 12px;margin-bottom:20px;border-radius:var(--r);
}
.p-year{
  font-family:'Archivo';font-weight:800;font-size:.95rem;letter-spacing:.1em;
  color:var(--blue);margin-bottom:10px;
}
h1.p-title{font-size:clamp(2rem,5vw,3.4rem);margin-bottom:22px}
.p-tags{display:flex;flex-wrap:wrap;gap:8px}
.p-text .p-tags{margin-top:26px}
.p-tags span{
  font-size:.7rem;letter-spacing:.04em;color:var(--ink);
  border:1px solid var(--line);padding:5px 11px;text-transform:uppercase;border-radius:var(--r);
}

.p-body{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
@media(max-width:860px){.p-body{grid-template-columns:1fr}}
.p-media{overflow:hidden}
.p-media figure{margin:0}
.p-media img{width:100%;height:auto;box-sizing:border-box;background:var(--panel);border-radius:var(--r-img);border:1px solid var(--line)}
.p-media.trans img{transform:scale(1.015)} /* masks a ~2px rounding gap between the container's aspect-ratio and the image's real size */
.p-media figcaption{
  margin-top:8px;font-size:.7rem;color:var(--grey);letter-spacing:.04em;
  text-align:center;text-transform:uppercase;
}
.p-media.multi{display:flex;flex-direction:column;gap:20px}
.p-media img{cursor:zoom-in}

/* ===== click-to-enlarge lightbox for project images ===== */
.lightbox{
  position:fixed;inset:0;z-index:9999;
  display:flex;align-items:center;justify-content:center;
  background:rgba(10,10,16,.88);
  opacity:0;pointer-events:none;
  transition:opacity .25s ease;
  padding:40px;
}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox img{
  max-width:70vw;max-height:70vh;
  border-radius:var(--r-img);
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  transform:scale(.96);
  transition:transform .25s ease;
}
@media(max-width:900px){
  /* the lightbox's own 40px padding was still shrinking the image inward
     from the edges even with width:100% — remove it so the image can
     actually reach the screen edges, matching the main page */
  .lightbox{padding:0}
  .lightbox img{max-width:100vw;max-height:100svh;width:100%}
}
.lightbox.open img{transform:scale(1)}
.lightbox .lb-close{
  position:absolute;top:24px;right:28px;z-index:3;
  background:none;border:none;color:#fff;font-size:1.4rem;
  cursor:pointer;line-height:1;padding:8px;
}
.lightbox .lb-arrow{
  position:absolute;top:0;bottom:0;z-index:2;width:12%;max-width:72px;
  border:none;background:none;padding:0;cursor:pointer;
  display:flex;align-items:center;color:#fff;
  font-family:'JetBrains Mono',monospace;font-size:1.6rem;line-height:1;
  opacity:.6;transition:opacity .2s ease,color .2s ease;
}
.lightbox .lb-arrow:hover{opacity:1;color:var(--blue)}
.lightbox .lb-arrow.prev{left:80px;justify-content:flex-start;padding-left:14px}
.lightbox .lb-arrow.next{right:80px;justify-content:flex-end;padding-right:14px}
@media(max-width:900px){
  /* the image is full-width on mobile, so the 80px desktop inset would sit
     on top of the image instead of at the screen edge — pull both arrows
     back to a small, symmetric edge distance */
  .lightbox .lb-arrow.prev{left:8px}
  .lightbox .lb-arrow.next{right:8px}
}

.p-text .txt{font-size:.85rem;color:var(--ink);line-height:1.95;margin-bottom:20px}
.p-text .more{font-size:.85rem;color:var(--grey);line-height:1.95}
.p-text .txt .inline-link,.p-text .more .inline-link{color:var(--blue);font-weight:700;text-decoration:none}
.p-text .txt .inline-link:hover,.p-text .more .inline-link:hover{text-decoration:underline}
.p-text h2{font-size:1rem;margin:0 0 14px;letter-spacing:0}

.p-nav{
  margin-top:70px;padding-top:28px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
}

footer{
  padding:28px clamp(16px,3vw,40px);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  border-top:1px solid var(--line);font-size:.72rem;color:var(--grey);
}

const PROJECTS=[
  {

    title:'Axial Flux Machine — Surrogate-Based Topology Optimization',
    tags:['Ansys','FEM','Surrogate Modeling','Electric Machines','Optimization'],
    txt:'YASA axial-flux machines offer outstanding torque density, but their 3D flux paths demand expensive transient 3D-FEM simulations. An adaptive sampling strategy (AMOP) builds a surrogate model linking design parameters to performance, while a self-developed constraint cascade narrows the global design space to the technically relevant region — derived purely from data, no heuristics required.',
    more:'The thesis combined design-of-experiments sampling with an actively updated surrogate model, so every additional 3D-FEM simulation was spent where it improved prediction accuracy the most rather than covering the design space uniformly. This cut the number of expensive transient simulations substantially while keeping the surrogate reliable across the full parameter range. The constraint cascade was built to automatically reject infeasible or irrelevant designs early, letting the optimizer focus purely on machine geometries that were both manufacturable and electromagnetically meaningful.',
    media:{type:'single',img:'img/axialflux.png',alt:'Axial Flux Machine — Surrogate-Based Topology Optimization',trans:true,framed:true,caption:'Yokeless and Segmented Armature Axialfluxmachine with cooling ring',w:1400,h:999}
  },
  {
    slug:'coffee-grinder',
    label:'Physical Prototype &bull; <a href="https://www.hs-pforzheim.de" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Pforzheim University</a>',
    year:'2024',
    title:'Manual Coffee Grinder Inspired by Charles Eames',
    tags:['Industrial Design','Sketching','Prototyping','CMF'],
    txt:'Semester project: conceptualize, design, construct and build a manual coffee grinder based on the design language of a well-known designer. For this project I chose the renowned designer <a href="https://www.eamesoffice.com/the-work/lounge-chair-and-ottoman/" target="_blank" rel="noopener" class="inline-link">Charles Eames</a> and prototyped a reimagined coffee grinder.',
    more:'Starting with hand sketches exploring proportions and form factors, the concept was refined in CAD, balancing the wood material with the matte aluminium frame. The outcome is an object that lives from the connection between the two materials and their details. The design was manufactured via 3D printing and finished with a coating to achieve a realistic-looking prototype.',
    media:{type:'multi',imgs:[
      {src:'img/grinder-render-1.jpg',alt:'Manual Coffee Grinder — CAD rendering',caption:'Front view of the final coffee grinder concept'},
      {src:'img/grinder-render-2.jpg',alt:'Manual Coffee Grinder — CAD rendering side view',caption:'Back view of the final coffee grinder concept'}
    ]}
  },
  {
    slug:'autonomous-robot',
    label:'Bachelor Thesis &bull; <a href="https://evomotiv.de" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Evomotiv GmbH</a>',
    year:'2022',
    title:'Autonomous Robot for Vehicle Test Automation',
    tags:['Mechatronics','Sensors','Stakeholder Management','Functional Prototypes'],
    txt:'My Bachelor thesis was about the development of a GPS-based mobile robot for test automation of autonomously parking vehicles. The project grew later on into <a href="https://evomotiv.de/evorobotics-intelligente-validierung/" target="_blank" rel="noopener" class="inline-link">more platforms</a> enabling further test scenarios for autonomous vehicles — now in productive use.',
    more:'The task was to design a robot small enough to fit underneath a wide variety of test objects. This was necessary because the robot needed to alter the geometry of the test objects as little as possible. A mechatronic concept therefore had to be developed that met the requirements for payload capacity, acceleration, speed and positioning accuracy. The tight installation space made this a particularly challenging project.',
    media:{type:'single',img:'img/robot-no-logo.png',alt:'Autonomous Robot for Vehicle Test Automation',caption:'Bachelor thesis: final design of the mobile robot platform',w:1400,h:1050}
  },
  {
    slug:'velomobil',
    label:'Concept &bull; Own Project',
    year:'2021',
    title:'Velomobil — Aerodynamic Pedal Vehicle',
    tags:['Surface Modeling','Rendering','Aerodynamics','Carbon Fiber'],
    txt:'An aerodynamically shaped vehicle with a low drag coefficient that helps gain speed while pedaling. The concept features a carbon fiber monocoque chassis with technical components sourced mostly from bicycles.',
    more:'The project was an exercise in class-A surface modeling: shaping a smooth, low-drag envelope around a recumbent riding position and off-the-shelf bicycle drivetrain components. The carbon fiber monocoque concept was developed to keep weight low while giving the shell enough stiffness to serve as the primary structure, eliminating the need for a separate frame. Renderings were used throughout to iterate on proportions and surface transitions before committing to any tooling decisions.',

    year:'2021',

    more:'Built to retrofit onto an existing window frame without modification, the system combines a 3D-printed linkage mechanism, an Arduino-based control unit and a sound-level sensor to automatically ventilate a room when it gets noisy outside and close again once it quiets down. The project covered the full stack from kinematic design of the opening mechanism to firmware and enclosure design, and was run with a small team — giving early hands-on experience in coordinating mechanical, electronic and software work streams on a tight timeline.',

    year:'2026',
    title:'Steer by Wire',
    tags:['CAD','Prototyping'],
    txt:'The steering system was developed as a subsystem of a chassis that lets the <a href="https://herois.pt/atletas-herois/iron-brothers/" target="_blank" rel="noopener" class="inline-link">Iron Brothers</a> compete in an Ironman race — used to push a person over the running distance and tow them over the cycling distance. It\'s meant to make the running distance more comfortable for the athlete, letting the vehicle be steered directly via the handlebar instead of being lifted to change direction.',
    more:'To this end, a feasibility study was first carried out on integrating a steering system into the existing chassis. Several steering actuation concepts were developed and studied for how the steering kinematics affect handling and steering forces. Since the priority was steering comfort, an electric steering concept was chosen. To size the steering actuator, the kinematics were implemented in the MuJoCo simulation environment, a custom tire model was developed, and the vehicle dynamics were simulated. This yielded the load cases needed to select a suitable actuator and generate the ideal geometry via generative design. Additional functional surfaces were then added and the part was smoothed, resulting in the final shape.',
    media:{type:'multi',imgs:[{src:'img/Steering3b.png',alt:'Steer by Wire',caption:'Rendered chassis component',w:1177,h:697},{src:'img/Steering4b.png',alt:'Steer by Wire',caption:'Full vehicle render',w:542,h:384},{src:'img/Steering5b.png',alt:'Steer by Wire',caption:'Steering hub detail',w:887,h:581},{src:'img/Steering2b.png',alt:'Steer by Wire',caption:'Explosion view steering system down',w:1488,h:914}]}

function mediaHTML(m){
  const dims=i=>i.w&&i.h?` width="${i.w}" height="${i.h}"`:'';
  if(m.type==='multi'){
    return `<div class="p-media multi">${m.imgs.map(i=>`<figure><img src="${i.src}" alt="${i.alt}" loading="lazy"${dims(i)}>${i.caption?`<figcaption>${i.caption}</figcaption>`:''}</figure>`).join('')}</div>`;
  }
  // only for object-fit:contain ("trans") images — cover-fit images crop to
  // any box height fine, but contain needs the box to match the image's own
  // ratio, or it letterboxes with empty side margins
  const ratio=m.trans&&m.w&&m.h?` style="aspect-ratio:${m.w}/${m.h}"`:'';
  return `<div class="p-media${m.trans?' trans':''}${m.framed?' framed':''}"${ratio}><figure><img src="${m.img}" alt="${m.alt}" loading="lazy"${dims(m)}>${m.caption?`<figcaption>${m.caption}</figcaption>`:''}</figure></div>`;
}

const slug=params.get('slug');
const idx=PROJECTS.findIndex(p=>p.slug===slug);
const proj=idx>=0?PROJECTS[idx]:null;

// natively and smoothly instead of needing custom JS to land in the

  const prev=PROJECTS[(idx-1+PROJECTS.length)%PROJECTS.length];
  const next=PROJECTS[(idx+1)%PROJECTS.length];

    set('canonicalLink','href',pageUrl);
    set('ogTitle','content',proj.title+' — Linus Kuhn');
    set('ogDescription','content',desc);
    set('ogUrl','content',pageUrl);
    set('ogImage','content',img);
    set('twitterTitle','content',proj.title+' — Linus Kuhn');
    set('twitterDescription','content',desc);
    set('twitterImage','content',img);

      "@context":"https://schema.org",
      "@type":"CreativeWork",
      "name":proj.title,
      "description":desc,
      "url":pageUrl,
      "image":img,
      "dateCreated":String(proj.year),
      "creator":{"@type":"Person","name":"Linus Kuhn","url":base},
      "keywords":proj.tags.join(', ')
    };

  main.innerHTML=`

/* ===== click-to-enlarge lightbox: clicking any project image opens it
   centered and enlarged over a dark backdrop ===== */
let lightboxEl=null, lbImgs=[], lbIdx=0;
function updateLightboxImage(){
  const img=lbImgs[lbIdx];
  if(!img)return;
  const lbImg=lightboxEl.querySelector('img');
  lbImg.src=img.currentSrc||img.src;
  lbImg.alt=img.alt||'';
}
function openLightbox(img,gallery){
  lbImgs=gallery||[img];
  lbIdx=Math.max(0,lbImgs.indexOf(img));
  if(!lightboxEl){
    lightboxEl=document.createElement('div');
    lightboxEl.className='lightbox';
    lightboxEl.innerHTML='<button class="lb-close" type="button" aria-label="Close">✕</button><button class="lb-arrow prev" type="button" aria-label="Previous image">←</button><img alt=""><button class="lb-arrow next" type="button" aria-label="Next image">→</button>';
    document.body.appendChild(lightboxEl);
    const lbImgEl=lightboxEl.querySelector('img');
    const closeLb=()=>{
      lightboxEl.classList.remove('open');
      document.body.style.overflow='';
    };
    lightboxEl.addEventListener('click',e=>{if(e.target===lightboxEl)closeLb();});
    lightboxEl.querySelector('.lb-close').addEventListener('click',closeLb);
    lightboxEl.querySelector('.lb-arrow.prev').addEventListener('click',()=>{
      lbIdx=(lbIdx-1+lbImgs.length)%lbImgs.length;
      updateLightboxImage();
    });
    lightboxEl.querySelector('.lb-arrow.next').addEventListener('click',()=>{
      lbIdx=(lbIdx+1)%lbImgs.length;
      updateLightboxImage();
    });
    addEventListener('keydown',e=>{
      if(!lightboxEl.classList.contains('open'))return;
      if(e.key==='Escape')closeLb();
      if(e.key==='ArrowLeft')lightboxEl.querySelector('.lb-arrow.prev').click();
      if(e.key==='ArrowRight')lightboxEl.querySelector('.lb-arrow.next').click();
    });
    // swipe left/right on the image to move through the gallery while the
    // lightbox is open; swipe up outside the image to dismiss, like iPhone
    // users expect from the native Photos app
    let lsx=0,lsy=0,ltrack=false,lsOnImg=false;
    lightboxEl.addEventListener('touchstart',e=>{
      lsx=e.touches[0].clientX;lsy=e.touches[0].clientY;ltrack=true;
      lsOnImg=e.target===lbImgEl;
    },{passive:true});
    lightboxEl.addEventListener('touchmove',e=>{
      if(!ltrack)return;
      const dx=e.touches[0].clientX-lsx,dy=e.touches[0].clientY-lsy;
      if(lsOnImg&&lbImgs.length>1&&Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>10)e.preventDefault();
      else if(!lsOnImg&&dy<0&&Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>10)e.preventDefault();
    },{passive:false});
    lightboxEl.addEventListener('touchend',e=>{
      if(!ltrack)return;
      ltrack=false;
      const dx=e.changedTouches[0].clientX-lsx,dy=e.changedTouches[0].clientY-lsy;
      if(!lsOnImg&&dy<-40&&Math.abs(dy)>Math.abs(dx)){
        closeLb();
        return;
      }
      if(lbImgs.length>1&&Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)){
        lbIdx=(lbIdx+(dx<0?1:-1)+lbImgs.length)%lbImgs.length;
        updateLightboxImage();
      }
    });
  }
  updateLightboxImage();
  lightboxEl.querySelectorAll('.lb-arrow').forEach(b=>b.style.display=lbImgs.length>1?'flex':'none');
  document.body.style.overflow='hidden';
  requestAnimationFrame(()=>lightboxEl.classList.add('open'));
}
main.addEventListener('click',e=>{
  const img=e.target.closest('.p-media img');
  if(!img)return;
  const gallery=[...img.closest('.p-media').querySelectorAll('img')];
  openLightbox(img,gallery);
});
</script>
