<style>
:root{
  --bg:#faf9f5;
  --panel:#f1efe8;
  --blue:#3a3af0;
  --blue-soft:#eceafe;
  --ink:#17171d;
  --grey:#6d6d78;
  --line:rgba(23,23,29,.14);
  --r:4px;
  --r-img:4px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'JetBrains Mono',monospace;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,.display{
  font-family:'Archivo',sans-serif;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:-.02em;
  line-height:1.02;
}
a{color:inherit;text-decoration:none}
::selection{background:var(--blue);color:#fff}
img{display:block;max-width:100%}

.boxlink{
  display:inline-block;
  font-family:'Archivo',sans-serif;
  font-weight:500;
  font-size:.85rem;
  letter-spacing:-.02em;
  text-transform:uppercase;
  color:var(--ink);
  transition:color .15s;
}
.boxlink:hover{color:var(--blue)}
.boxlink.inv{color:var(--ink)}
.boxlink.inv:hover{color:var(--blue)}
.arrow-l::before{content:"\2190";margin-right:6px}
.arrow::after{content:"\2192";margin-left:6px}

.crumb-bar{
  position:sticky;top:0;z-index:100;
  padding:16px clamp(20px,5vw,40px);
  background:rgba(250,249,245,.55);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  transition:top .3s ease;
}
.crumb-bar.hide{top:-90px}

main{max-width:1100px;margin:0 auto;padding:30px clamp(20px,5vw,40px) 80px}

.p-head{border-bottom:var(--dash,1px solid rgba(23,23,29,.16));padding-bottom:0;margin-bottom:34px}
.p-label{
  display:inline-block;align-self:flex-start;
  background:var(--blue-soft);color:var(--blue);
  font-size:.72rem;font-weight:700;letter-spacing:.04em;
  padding:4px 12px;margin-bottom:20px;border-radius:var(--r);
}
.p-year{
  font-family:'Archivo';font-weight:800;font-size:.95rem;letter-spacing:.1em;
  color:var(--blue);margin-bottom:10px;
}
h1.p-title{font-size:clamp(2rem,5vw,3.4rem);margin-bottom:22px}
.p-tags{display:flex;flex-wrap:wrap;gap:8px}
.p-text .p-tags{margin-top:26px}
.p-tags span{
  font-size:.7rem;letter-spacing:.04em;color:var(--ink);
  border:1px solid var(--line);padding:5px 11px;text-transform:uppercase;border-radius:var(--r);
}

.p-body{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
@media(max-width:860px){.p-body{grid-template-columns:1fr}}
.p-media{overflow:hidden}
.p-media figure{margin:0}
.p-media img{width:100%;height:auto;box-sizing:border-box;background:var(--panel);border-radius:var(--r-img);border:1px solid var(--line)}
.p-media figcaption{
  margin-top:8px;font-size:.7rem;color:var(--grey);letter-spacing:.04em;
  text-align:center;text-transform:uppercase;
}
.p-media.multi{display:flex;flex-direction:column;gap:20px}

.p-text .txt{font-size:.85rem;color:var(--ink);line-height:1.95;margin-bottom:20px}
.p-text .more{font-size:.85rem;color:var(--grey);line-height:1.95}
.p-text h2{font-size:1rem;margin:0 0 14px;letter-spacing:0}

.p-nav{
  margin-top:70px;padding-top:28px;border-top:1px solid var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
}

footer{
  padding:28px clamp(16px,3vw,40px);
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;
  border-top:1px solid var(--line);font-size:.72rem;color:var(--grey);
}

<script>
const PROJECTS=[
  {
    slug:'axial-flux-machine',
    label:'Master Thesis &bull; Pforzheim University',
    year:'2025',
    title:'Axial Flux Machine — Surrogate-Based Topology Optimization',
    tags:['Ansys','FEM','Surrogate Modeling','Electric Machines','Optimization'],
    txt:'YASA axial-flux machines offer outstanding torque density, but their 3D flux paths demand expensive transient 3D-FEM simulations. An adaptive sampling strategy (AMOP) builds a surrogate model linking design parameters to performance, while a self-developed constraint cascade narrows the global design space to the technically relevant region — derived purely from data, no heuristics required.',
    more:'The thesis combined design-of-experiments sampling with an actively updated surrogate model, so every additional 3D-FEM simulation was spent where it improved prediction accuracy the most rather than covering the design space uniformly. This cut the number of expensive transient simulations substantially while keeping the surrogate reliable across the full parameter range. The constraint cascade was built to automatically reject infeasible or irrelevant designs early, letting the optimizer focus purely on machine geometries that were both manufacturable and electromagnetically meaningful.',
    media:{type:'single',img:'img/axialflux.png',alt:'Axial Flux Machine — Surrogate-Based Topology Optimization',trans:true,framed:true,caption:'Yokeless and Segmented Armature Axialfluxmachine with cooling ring'}
  },
  {
    slug:'coffee-grinder',
    label:'Physical Prototype &bull; Pforzheim University',
    year:'2024',
    title:'Manual Coffee Grinder Inspired by Charles Eames',
    tags:['Industrial Design','Sketching','Prototyping','CMF'],
    txt:'Semester project: conceptualize, design, construct and build a manual coffee grinder based on the design language of a well-known designer — realized in walnut wood and an aluminium frame through a creative, iterative, sketch-based design process.',
    more:'Starting from dozens of hand sketches exploring proportion and grip, the concept was refined into a CAD model balancing the warmth of solid walnut against a satin-finished aluminium frame. Material and manufacturing choices were made with hand-tool workshop fabrication in mind — the wood body was turned and hand-finished, while the frame was CNC-machined to keep tight tolerances around the burr mechanism. The result is a fully functional grinder that channels Eames-era material honesty into a small, everyday object.',
    media:{type:'multi',imgs:[
      {src:'img/grinder-render-1.jpg',alt:'Manual Coffee Grinder — CAD rendering',caption:'Front view of the final coffee grinder concept'},
      {src:'img/grinder-render-2.jpg',alt:'Manual Coffee Grinder — CAD rendering side view',caption:'Back view of the final coffee grinder concept'}
    ]}
  },
  {
    slug:'autonomous-robot',
    label:'Bachelor Thesis &bull; Evomotiv GmbH',
    year:'2022',
    title:'Autonomous Robot for Vehicle Test Automation',
    tags:['Mechatronics','Sensors','Stakeholder Management','Functional Prototypes'],
    txt:'Development of a GPS-based mobile robot for test automation of autonomously parking vehicles. The project grew into an ecosystem of robots enabling further test scenarios for autonomous vehicles — now in productive use.',
    more:'The robot needed to reproduce pedestrian and obstacle behavior around a test vehicle with centimeter-level positioning repeatability, driven by RTK-GPS and closed-loop motor control. Beyond the hardware, the thesis involved close coordination with test engineers to translate real test scenarios into robot behavior, and the platform was designed to be extendable — later test scenarios reused the same chassis and control architecture with different sensor payloads, turning a single prototype into a small fleet used in day-to-day validation work.',
    media:{type:'single',img:'img/robot.jpg',alt:'Autonomous Robot for Vehicle Test Automation',caption:'Bachelor thesis: final design of the mobile robot platform'}
  },
  {
    slug:'velomobil',
    label:'Concept &bull; Own Project',
    year:'2021',
    title:'Velomobil — Aerodynamic Pedal Vehicle',
    tags:['Surface Modeling','Rendering','Aerodynamics','Carbon Fiber'],
    txt:'An aerodynamically shaped vehicle with a low drag coefficient that helps gain speed while pedaling. The concept features a carbon fiber monocoque chassis with technical components sourced mostly from bicycles.',
    more:'The project was an exercise in class-A surface modeling: shaping a smooth, low-drag envelope around a recumbent riding position and off-the-shelf bicycle drivetrain components. The carbon fiber monocoque concept was developed to keep weight low while giving the shell enough stiffness to serve as the primary structure, eliminating the need for a separate frame. Renderings were used throughout to iterate on proportions and surface transitions before committing to any tooling decisions.',
    media:{type:'natural',img:'img/velomobil.jpg',alt:'Velomobil — Aerodynamic Pedal Vehicle',caption:'Velomobil concept in different styles'}
  },
  {
    slug:'automated-window',
    label:'Physical Prototype &bull; Karlsruhe University',
    year:'2021',
    title:'Automated Window',
    tags:['Kinematics','Arduino','3D Printing','Electronics','Project Management'],
    txt:'A retrofittable system that opens and closes a window depending on the ambient noise level — designed, printed and wired as a complete mechatronic system.',
    more:'Built to retrofit onto an existing window frame without modification, the system combines a 3D-printed linkage mechanism, an Arduino-based control unit and a sound-level sensor to automatically ventilate a room when it gets noisy outside and close again once it quiets down. The project covered the full stack from kinematic design of the opening mechanism to firmware and enclosure design, and was run with a small team — giving early hands-on experience in coordinating mechanical, electronic and software work streams on a tight timeline.',
    media:{type:'single',img:'img/window.png',alt:'Automated Window',trans:true,framed:true,caption:'Front view of the retrofittable system for automatically opening and closing the window'}
  },
  {
    slug:'raceboat',
    label:'Physical Prototype &bull; Own Project',
    year:'2019',
    title:'Remote Controlled Carbon Fiber Raceboat',
    tags:['Mold Making','Composite Lamination','3D Printing'],
    txt:'A racing boat with a carbon fiber hull, laminated using 3D-printed negative molds and driven by a 500W brushless DC motor with turboprop — one of the first projects built with my own 3D printer.',
    more:'The hull shape was designed in CAD and split into 3D-printed negative mold segments, which were then used to hand-laminate a lightweight carbon fiber shell. Getting a fair, low-drag hull out of a segmented mold — and finishing the seams to a race-ready surface — was the core challenge of the build. Propulsion came from a 500W brushless DC motor paired with a turboprop drive, making this one of the first projects where CAD design, 3D-printed tooling and composite fabrication all came together end to end.',
    media:{type:'single',img:'img/raceboat.jpg',alt:'Remote Controlled Carbon Fiber Raceboat',caption:'Carbon fiber raceboat on the water'}
  },
  {
    slug:'rotary-engine',
    label:'Concept &bull; Own Project',
    year:'2017',
    title:'Rotary Combustion Engine',
    tags:['Fusion 360','Thermodynamics','Engine Engineering'],
    txt:'An engine concept with a rotating piston and movable valves forming the combustion chamber — one of my first projects in Autodesk Fusion 360 and the start of it all.',
    more:'Rather than a conventional reciprocating piston, this concept explores a rotating piston geometry where the combustion chamber is formed dynamically by moving valves as the rotor turns. As an early self-directed project, it was as much about learning parametric CAD modeling in Fusion 360 as it was about working through the thermodynamic cycle and sealing challenges inherent to rotary combustion designs. It marks the starting point of the hands-on, design-driven approach carried through every project since.',
    media:{type:'natural',img:'img/engine.jpg',alt:'Rotary Combustion Engine',caption:'Final concept of a rotating piston motor'}
  },
  {
    slug:'steer-by-wire',
    label:'Project &bull; Own Project',
    year:'2026',
    title:'Steer by Wire',
    tags:['CAD','Prototyping'],
    txt:'To implement a lightweight functional design of a Steer by Wire application.',
    more:'An ongoing project developing a lightweight, functional steer-by-wire setup — removing the mechanical link between steering wheel and wheels in favor of a sensor-and-actuator-driven system. Work so far has focused on the mechanical layout and packaging of the actuator unit in CAD, with functional prototyping planned as the next step to validate steering feel and response.',
    media:{type:'multi',imgs:[{src:'img/Steering.png',alt:'Steer by Wire',caption:'Explosion view steering system top'},{src:'img/Steering2.png',alt:'Steer by Wire',caption:'Explosion view steering system down'}]}
  }
];

function mediaHTML(m){
  if(m.type==='multi'){
    return `<div class="p-media multi">${m.imgs.map(i=>`<figure><img src="${i.src}" alt="${i.alt}" loading="lazy">${i.caption?`<figcaption>${i.caption}</figcaption>`:''}</figure>`).join('')}</div>`;
  }
  return `<div class="p-media${m.trans?' trans':''}${m.framed?' framed':''}"><figure><img src="${m.img}" alt="${m.alt}" loading="lazy">${m.caption?`<figcaption>${m.caption}</figcaption>`:''}</figure></div>`;
}

const params=new URLSearchParams(location.search);
const slug=params.get('slug');
const idx=PROJECTS.findIndex(p=>p.slug===slug);
const proj=idx>=0?PROJECTS[idx]:null;
const main=document.getElementById('main');

// point "Back to Portfolio" straight at this project's card on the
// homepage — a plain anchor link, so the browser handles the scroll
// natively and smoothly instead of needing custom JS to land in the
// right spot (same approach as the Interests subpages' back link)
if(slug){
  const backLink=document.getElementById('backLink');
  if(backLink)backLink.href='index.html#project-'+slug;
}

if(!proj){
  main.innerHTML=`
    <h1 class="p-title">Project not found</h1>
    <p class="txt" style="margin-top:16px">This project doesn't exist (anymore). Head back to see all projects.</p>
  `;
}else{
  const prev=PROJECTS[(idx-1+PROJECTS.length)%PROJECTS.length];
  const next=PROJECTS[(idx+1)%PROJECTS.length];
  document.title=proj.title+' — Linus Kuhn';

  // SEO/GEO: fill in per-project meta tags, canonical URL and structured
  // data now that we know which project this page instance represents
  (()=>{
    const base='https://96linuskuhn-byte.github.io/linuskuhn.io/';
    const pageUrl=base+'project.html?slug='+proj.slug;
    const desc=(proj.txt||'').replace(/<[^>]*>/g,'').slice(0,300);
    const img=base+(proj.media.type==='multi'?proj.media.imgs[0].src:proj.media.img);
    const set=(id,attr,val)=>{const el=document.getElementById(id);if(el)el.setAttribute(attr,val)};
    document.querySelector('meta[name="description"]').setAttribute('content',desc);
    set('canonicalLink','href',pageUrl);
    set('ogTitle','content',proj.title+' — Linus Kuhn');
    set('ogDescription','content',desc);
    set('ogUrl','content',pageUrl);
    set('ogImage','content',img);
    set('twitterTitle','content',proj.title+' — Linus Kuhn');
    set('twitterDescription','content',desc);
    set('twitterImage','content',img);
    const ld={
      "@context":"https://schema.org",
      "@type":"CreativeWork",
      "name":proj.title,
      "description":desc,
      "url":pageUrl,
      "image":img,
      "dateCreated":String(proj.year),
      "creator":{"@type":"Person","name":"Linus Kuhn","url":base},
      "keywords":proj.tags.join(', ')
    };
    const ldEl=document.getElementById('ldJson');
    if(ldEl)ldEl.textContent=JSON.stringify(ld);
  })();

  main.innerHTML=`
    <div class="p-head">
      <span class="p-label">${proj.label}</span>
      <div class="p-year">${proj.year}</div>
      <h1 class="p-title">${proj.title}</h1>
    </div>
    <div class="p-body">
      ${mediaHTML(proj.media)}
      <div class="p-text">
        <h2>Overview</h2>
        <p class="txt">${proj.txt}</p>
        <p class="more">${proj.more}</p>
        <div class="p-tags">${proj.tags.map(t=>`<span>${t}</span>`).join('')}</div>
      </div>
    </div>
    <div class="p-nav">
      <a class="boxlink inv arrow-l" href="project.html?slug=${prev.slug}">${prev.title}</a>
      <a class="boxlink arrow" href="project.html?slug=${next.slug}">${next.title}</a>
    </div>
  `;
}

/* ===== hide crumb-bar on scroll down, show on scroll up ===== */
(function(){
  const bar=document.querySelector('.crumb-bar');
  if(!bar)return;
  let lastY=scrollY,ticking=false;
  function onScroll(){
    const y=Math.max(0,scrollY);
    const delta=y-lastY;
    if(y>bar.offsetHeight&&delta>4){bar.classList.add('hide');}
    else if(delta<-4||y<=bar.offsetHeight){bar.classList.remove('hide');}
    lastY=y;
    ticking=false;
  }
  addEventListener('scroll',()=>{
    if(!ticking){requestAnimationFrame(onScroll);ticking=true;}
  },{passive:true});
})();
</script>
